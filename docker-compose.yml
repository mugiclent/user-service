services:
  user-svc:
    image: ${DOCKER_USERNAME}/user-svc:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-svc
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}

      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST:-pgbouncer}
      DB_PORT: ${DB_PORT:-6432}

      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}

      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}

      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}

      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS}
      OTP_LENGTH: ${OTP_LENGTH}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      OTP_WINDOW_SECONDS: ${OTP_WINDOW_SECONDS}

      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS}
      RATE_LIMIT_RESET_MAX: ${RATE_LIMIT_RESET_MAX}
      RATE_LIMIT_RESET_WINDOW_SECONDS: ${RATE_LIMIT_RESET_WINDOW_SECONDS}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      APP_URL: ${APP_URL}
      STAFF_APP_URL: ${STAFF_APP_URL}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_PRESIGNED_EXPIRES_IN: ${S3_PRESIGNED_EXPIRES_IN}
    networks:
      - katisha-net

networks:
  katisha-net:
    external: true
